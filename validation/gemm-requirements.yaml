  - id: G1-numerical
    required: true
    owner: numerics
    requirement: "All required numerical tests pass on every required supported target and mode."
    status: blocked
    source_sha: 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [numerical_reference, numerical_quantized_inputs, tolerance_model, exceptional_values]
    evidence:
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/I6-report.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T39a-report.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/remote-hal/hal-hip-gemmnumerics-run.log"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/remote-hal/hal-oneapi-gemmnumerics-run.log"
      - "/tmp/alpaka-orchestration/gemm-20261025/LEDGER.md"
    evidence_shas:
      - 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
      - 76d92ba684cd203ad1007f106e3819d7ab21e40f
      - e2d552bee79c7479e3044723ee1a26f90e5e70d7
      - d6ea524015b5852dec968375d400b2cf9d37eb91
    status_reason: "Passing correctness evidence exists for CUDA sm_70/75/80 and both host CPUs; HIP gfx906 and oneAPI pass fp32, fp16 and bf16. FP64 SKIPs on HIP and oneAPI because long double is 53-bit (printed reason). That limitation is recorded, not counted as a pass. No rerun exists at final include/alpaka change 6e822093, and the per-case machine-readable samples are absent. Worst scaled errors: fp32 2.79e-07 (2.55e-07 with FMA contraction), fp64 2.32e-16, fp16 1.60e-07, bf16 8.78e-08."
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G1-ownership
    required: true
    owner: api-ownership
    requirement: "Ownership and layout tests prove exactly-once output ownership and valid A/B coordinates on every required supported target."
    status: blocked
    source_sha: 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [ownership_exhaustive, layout_bijection]
    evidence:
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/I6-report.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T39a-report.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/LEDGER.md"
    evidence_shas:
      - 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
      - 76d92ba684cd203ad1007f106e3819d7ab21e40f
    status_reason: "Ownership, layout and transpose cases are part of the gemm suite and pass on CUDA sm_70/75/80, HIP gfx906 and oneAPI through the modes that run. FP64 is skipped on HIP/oneAPI and no final-SHA rerun exists."
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G1-bounds
    required: true
    owner: api-ownership
    requirement: "Full and partial M, N and K regions compute every valid output once and suppress invalid loads and stores on every required supported target."
    status: blocked
    source_sha: 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [boundary_gemm, guarded_memory, zero_size]
    evidence:
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/I6-report.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T39a-report.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/LEDGER.md"
    evidence_shas:
      - 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
      - 76d92ba684cd203ad1007f106e3819d7ab21e40f
    status_reason: "Full and partial M/N/K and guarded-memory cases pass in the gemm suite on CUDA sm_70/75/80, HIP gfx906 and oneAPI. FP64 is skipped on HIP/oneAPI and no final-SHA rerun exists."
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G1-queue-lifetime
    required: true
    owner: sync-progress
    requirement: "Queue lifetime tests pass for planning, packing, scratch, kernel and epilogue dependencies on every required supported target."
    status: blocked
    source_sha: 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
