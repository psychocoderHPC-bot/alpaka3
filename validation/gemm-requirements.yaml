    tests: [quantum_boundaries, tile_boundaries]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: S8-STRUCT-planner-facts
    required: true
    owner: api-ownership
    requirement: "Planner tests cover missing cache and register data, small memory, subgroup widths other than 32, width one, large accumulator types and maximum index values using rejection tests."
