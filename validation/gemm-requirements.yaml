# GEMM requirement records for alpaka3.
# Specification: alpaka3 GEMM design guide, Version 2, 25 October 2026.
# Machine-readable companion to design/gemm.md.
#
# Schema: consumed by validation/check_acceptance.py. Requirement records carry
# the checker fields id, required, required_targets, modes, allowed_substitutions,
# case_ids, thresholds and review. status, source_sha, owner, tests and evidence
# are project metadata tolerated by the checker.
#
# Every requirement is pending at M0. source_sha stays null until a record is
# first verified. An evidence list is empty until external evidence exists.
#
# Frozen gate values are duplicated from the top-level `thresholds` block into
# the per-requirement `thresholds` lists so the checker can evaluate them.

schema_version: 1
project: alpaka3-gemm
status_vocabulary: [pending, passed, failed, blocked, not_applicable]
owner_roles: [api-ownership, numerics, sync-progress, cpu-codegen, gpu-native, benchmark-methodology, maintainability]

