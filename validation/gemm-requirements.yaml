thresholds:
  source: "guide section 10; frozen at M0"
  g3_abstraction_overhead:
    compute_heavy_median_throughput_ratio_to_identical_plan_min: 0.95
    compute_heavy_tolerance_percent: 5
    small_cases: "confidence and absolute latency analysis"
    metric: throughput_ratio_to_identical_plan_median
  g4_heuristic_quality:
    heldout_geomean_ratio_to_best_bounded_family_min: 0.95
    heldout_per_case_ratio_min: 0.85
    geomean_metric: heldout_geomean_ratio_to_best_bounded_family
    per_case_metric: heldout_case_ratio_min
  g5_large_gemm:
    large_aligned_square_geomean_ratio_to_matched_vendor_min: 0.90
    large_aligned_square_per_case_ratio_min: 0.80
    geomean_metric: large_square_geomean_vendor_ratio
    per_case_metric: large_square_case_vendor_ratio_min
  g6_broad_workload:
    per_target_mode_family_geomean_ratio_to_matched_vendor_min: 0.80
    blocking_investigation_case_ratio_below: 0.50
    geomean_metric: family_geomean_vendor_ratio
    floor_metric: case_vendor_ratio_min
  g7_regression:
    statistically_supported_regression_percent_max: 5
    metric: statistically_supported_regression_percent
    rule: "investigate exceptions rather than average them away"
  planning:
    candidate_plans_max_per_operation_type_compiled_target: 64
    metric: candidate_plans_max
    pruning: "prune before expensive instantiation where possible"
  build:
    ci_build_budget_seconds: null
    ci_build_budget_status: UNVERIFIED
    ci_build_budget_rule: "freeze at M0 from the existing build baseline with the CI flags; measure and record compile time and binary growth"
    measurement_protocol: "build base revision 6f13700c with the project CI configuration and flags; record CI build wall time and produced binary size; set budget = measured baseline * margin chosen before measurement"
    binary_growth_rule: "measure and record; any budget increase requires review and measured benefit"
  latency_limited:
    rule: "mark latency-limited cases during M0, report confidence intervals and absolute time, use a predeclared practical tolerance, and never classify a slow case as latency-limited after it fails"

requirements:
