      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/remote-hal/hal-hip-lockstep-run.log"
      - "/tmp/alpaka-orchestration/gemm-20261025/LEDGER.md"
    evidence_shas:
      - 73a28748e81bf5ed73703ffb621cf2d1bb4d177a
      - 76d92ba684cd203ad1007f106e3819d7ab21e40f
    status_reason: "Pipeline and staging correctness including device-callable transitions pass on CUDA and gfx906. Multi-queue and scratch-reuse lifetime are not separately evidenced, FP64 is skipped on HIP/oneAPI, and no final-SHA rerun exists."
    review: {reviewer: null, verdict: pending, findings: []}
