    evidence: []
    review:
      reviewer: null
      verdict: pending
      findings:
        - id: LOCKSTEP-ITEM4-zero-worker
          severity: major
          required: true
          resolved: false
          status: open
          summary: "the two-argument internal::getLockstepSimdWidth calls divCeil(logicalProduct, workerProduct) in consteval with no zero-worker guard; no test covers it"
