thresholds:
  source: "guide section 10; frozen at M0"
  g3_abstraction_overhead:
    compute_heavy_median_throughput_ratio_to_identical_plan_min: 0.95
    compute_heavy_tolerance_percent: 5
    small_cases: "confidence and absolute latency analysis"
    metric: throughput_ratio_to_identical_plan_median
  g4_heuristic_quality:
    heldout_geomean_ratio_to_best_bounded_family_min: 0.95
    heldout_per_case_ratio_min: 0.85
    geomean_metric: heldout_geomean_ratio_to_best_bounded_family
    per_case_metric: heldout_case_ratio_min
  g5_large_gemm:
    large_aligned_square_geomean_ratio_to_matched_vendor_min: 0.90
    large_aligned_square_per_case_ratio_min: 0.80
    geomean_metric: large_square_geomean_vendor_ratio
    per_case_metric: large_square_case_vendor_ratio_min
  g6_broad_workload:
    per_target_mode_family_geomean_ratio_to_matched_vendor_min: 0.80
    blocking_investigation_case_ratio_below: 0.50
    geomean_metric: family_geomean_vendor_ratio
    floor_metric: case_vendor_ratio_min
  g7_regression:
    statistically_supported_regression_percent_max: 5
    metric: statistically_supported_regression_percent
    rule: "investigate exceptions rather than average them away"
  planning:
    candidate_plans_max_per_operation_type_compiled_target: 64
    metric: candidate_plans_max
    pruning: "prune before expensive instantiation where possible"
  build:
    ci_build_budget_seconds: null
    ci_build_budget_status: UNVERIFIED
    ci_build_budget_rule: "freeze at M0 from the existing build baseline with the CI flags; measure and record compile time and binary growth"
    measurement_protocol: "build base revision 6f13700c with the project CI configuration and flags; record CI build wall time and produced binary size; set budget = measured baseline * margin chosen before measurement"
    binary_growth_rule: "measure and record; any budget increase requires review and measured benefit"
  latency_limited:
    rule: "mark latency-limited cases during M0, report confidence intervals and absolute time, use a predeclared practical tolerance, and never classify a slow case as latency-limited after it fails"

requirements:
  # G1 Correctness
  - id: G1-numerical
    required: true
    owner: numerics
    requirement: "All required numerical tests pass on every required supported target and mode."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [numerical_reference, numerical_quantized_inputs, tolerance_model, exceptional_values]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G1-ownership
    required: true
    owner: api-ownership
    requirement: "Ownership and layout tests prove exactly-once output ownership and valid A/B coordinates on every required supported target."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [ownership_exhaustive, layout_bijection]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G1-bounds
    required: true
    owner: api-ownership
    requirement: "Full and partial M, N and K regions compute every valid output once and suppress invalid loads and stores on every required supported target."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [boundary_gemm, guarded_memory, zero_size]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G1-queue-lifetime
    required: true
    owner: sync-progress
    requirement: "Queue lifetime tests pass for planning, packing, scratch, kernel and epilogue dependencies on every required supported target."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [async_lifetime, scratch_reuse, multi_queue]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G2 Common source
  - id: G2-common-source
    required: true
    owner: maintainability
    requirement: "Review finds no backend-specific GEMM body, architecture-name branch or special single-thread execution path."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [source_policy_review, preprocessor_guard_scan]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G2-vendor-symbol
    required: true
    owner: gpu-native
    requirement: "Every specialized intrinsic dispatches through the alpaka3 vendor/function-symbol interface and common GEMM code contains no backend-selection preprocessor macro."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [vendor_symbol_dispatch, fallback_dispatch, non_gemm_primitive_usage]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G3 Abstraction overhead
  - id: G3-abstraction-overhead
    required: true
    owner: cpu-codegen
    requirement: "Against identical-plan explicit code, median throughput on compute-heavy cases is within 5 percent; smaller cases use confidence and absolute latency analysis."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [explicit_plan_baseline, small_case_latency_analysis]
    thresholds:
      - {metric: throughput_ratio_to_identical_plan_median, op: ">=", value: 0.95}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G4 Heuristic quality
  - id: G4-heuristic-geomean
    required: true
    owner: benchmark-methodology
    requirement: "On held-out shapes per target and mode, the geometric mean throughput ratio to the best bounded-family candidate is at least 0.95."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [heldout_shapes, candidate_sweep_oracle]
    thresholds:
      - {metric: heldout_geomean_ratio_to_best_bounded_family, op: ">=", value: 0.95}
      - {metric: heldout_case_ratio_min, op: ">=", value: 0.85}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G4-heuristic-per-case
    required: true
    owner: benchmark-methodology
    requirement: "On held-out shapes per target and mode, each case reaches at least 0.85 of the best bounded-family candidate."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [heldout_shapes, candidate_sweep_oracle]
    thresholds:
      - {metric: heldout_case_ratio_min, op: ">=", value: 0.85}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G5 Competitive large GEMM
  - id: G5-large-gemm
    required: true
    owner: benchmark-methodology
    requirement: "On large aligned square cases per target and mode, the geometric mean matched-vendor throughput ratio is at least 0.90 and every case is at least 0.80."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [large_square_benchmark, matched_vendor_benchmark]
    thresholds:
      - {metric: large_square_geomean_vendor_ratio, op: ">=", value: 0.90}
      - {metric: large_square_case_vendor_ratio_min, op: ">=", value: 0.80}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G6 Broad workload
  - id: G6-broad-workload
    required: true
    owner: benchmark-methodology
    requirement: "Per target, mode and workload family, the geometric mean matched-vendor throughput ratio is at least 0.80."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [broad_workload_benchmark, matched_vendor_benchmark]
    thresholds:
      - {metric: family_geomean_vendor_ratio, op: ">=", value: 0.80}
      - {metric: case_vendor_ratio_min, op: ">=", value: 0.50, required: false, rule: blocking_investigation}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G6-floor-case
    required: true
    owner: benchmark-methodology
    requirement: "Any individual case below 0.50 of matched vendor throughput is a blocking investigation rather than hidden in an aggregate."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [broad_workload_benchmark, per_case_floor_check]
    thresholds:
      - {metric: case_vendor_ratio_min, op: ">=", value: 0.50, required: false, rule: blocking_investigation}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G7 Regression
  - id: G7-regression
    required: true
    owner: benchmark-methodology
    requirement: "No statistically supported regression greater than 5 percent versus the previously accepted common implementation; exceptions are investigated rather than averaged away."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [regression_benchmark, variability_report]
    thresholds:
      - {metric: statistically_supported_regression_percent, op: "<=", value: 5}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G8 Resources
  - id: G8-resources
    required: true
    owner: gpu-native
    requirement: "No illegal launch or unbounded scratch occurs; selected hot plans have no unexplained spills; all packing and workspace costs are reported."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [launch_legality, scratch_bound, resource_report, spill_check]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G9 Native claims
  - id: G9-native-evidence
    required: true
    owner: gpu-native
    requirement: "Every fp16 native matrix mode claimed on a native-capable target has actual-hardware correctness, instruction and performance evidence; untested supported modes are not counted complete."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, fwk394/cuda, hal/oneapi-gpu, hal/hip]
    modes: [fp16_fp32]
    tests: [native_correctness, native_instruction_check, native_performance]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G9-native-evidence-bf16
    required: true
    owner: gpu-native
    requirement: "Every bf16 native matrix mode claimed on a bf16-native target has actual-hardware correctness, instruction and performance evidence; bf16 on Volta and Turing selects the tested fallback."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/oneapi-gpu, hal/hip]
    modes: [bf16_fp32]
    tests: [native_correctness, native_instruction_check, native_performance]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: G9-fallback
    required: true
    owner: gpu-native
    requirement: "Unsupported native capabilities select a tested common fallback and do not break generic builds or instantiate unsupported native combinations."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [fallback_correctness, unsupported_combination_rejection]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  # G10 Maintainability
  - id: G10-maintainability
    required: true
    owner: maintainability
    requirement: "Reproducible commands, plan diagnostics, documented numerical and boundary semantics, reviewed tests and a bounded template instantiation family are present."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [reproduction_check, diagnostics_snapshot, template_family_bound]
    thresholds:
      - {metric: candidate_plans_max, op: "<=", value: 64}
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}

  # Section 8 structural test family
  - id: S8-STRUCT-ownership
    required: true
    owner: api-ownership
    requirement: "Exhaustive small-shape and worker-count enumeration proves exactly-once C ownership and correct A/B coordinates for every layout and transpose."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [ownership_exhaustive, layout_bijection, transpose_coordinates]
    evidence: []
    review: {reviewer: null, verdict: pending, findings: []}
  - id: S8-STRUCT-simd-slots
    required: true
    owner: api-ownership
    requirement: "Unique coordinate IDs in local slots survive passes at different SIMD widths and through compatible views; broadcast reuse works and cross-worker access disguised as local access is rejected. A zero-worker or zero-extent lockstep scope is rejected at compile time."
