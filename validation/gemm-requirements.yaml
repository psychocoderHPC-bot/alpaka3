    review: {reviewer: null, verdict: pending, findings: []}
  # G3 Abstraction overhead
  - id: G3-abstraction-overhead
    required: true
    owner: cpu-codegen
    requirement: "Against identical-plan explicit code, median throughput on compute-heavy cases is within 5 percent; smaller cases use confidence and absolute latency analysis."
    status: blocked
    source_sha: bfac7feff886d5dc8e791b5f97a069c9275aabac
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [explicit_plan_baseline, small_case_latency_analysis]
    thresholds:
      - {metric: throughput_ratio_to_identical_plan_median, op: ">=", value: 0.95}
    evidence:
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T11c-1792950900/T11c-g3.md"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T11c-1792950900/summary.json"
      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T11c-raw/g3.stdout"
