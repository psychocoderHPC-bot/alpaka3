      - "/tmp/alpaka-orchestration/gemm-20261025/evidence/T11-codegen/abstraction-bench.log"
    evidence_shas:
      - bfac7feff886d5dc8e791b5f97a069c9275aabac
    status_reason: "12/12 assertions pass; ratios 1.023/1.064/1.097 on host and 0.997/1.066/1.097 on NumaCpu, all >= 0.95, so the abstracted path is equal or faster. Measured only on the hal host CPU under CpuOmpBlocks; that target is not in required_targets, the other six required targets are unmeasured, and no small-case latency analysis exists."
    review: {reviewer: null, verdict: pending, findings: []}
  # G4 Heuristic quality
  - id: G4-heuristic-geomean
    required: true
    owner: benchmark-methodology
    requirement: "On held-out shapes per target and mode, the geometric mean throughput ratio to the best bounded-family candidate is at least 0.95."
    status: not_run
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
    tests: [heldout_shapes, candidate_sweep_oracle]
    thresholds:
      - {metric: heldout_geomean_ratio_to_best_bounded_family, op: ">=", value: 0.95}
      - {metric: heldout_case_ratio_min, op: ">=", value: 0.85}
