  # Section 8 numerical test family
  - id: S8-NUM-reference
    required: true
    owner: numerics
    requirement: "A separately implemented scalar reference validates all modes, using FP64 reference accumulation for FP32 and converted FP16/BF16 inputs and a verified higher-precision or compensated reference for FP64."
    status: pending
    source_sha: null
    required_targets: [hal/cuda, hal/hip, hal/oneapi-cpu, hal/oneapi-gpu, fwk394/cpu, fwk394/cuda, fwk388/hip]
    modes: [fp32, fp64, fp16_fp32, bf16_fp32]
